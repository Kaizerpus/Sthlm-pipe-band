<svg xmlns="http://www.w3.org/2000/svg" width="20" height="15" viewBox="0 0 20 15">
  <!-- Blå bakgrund -->
  <rect width="20" height="15" fill="#012169"/>
  
  <!-- Vita diagonala streck (Saint Andrew's Cross) -->
  <path d="M0,0 L20,15 M20,0 L0,15" stroke="white" stroke-width="1.5" fill="none"/>
  
  <!-- Röda diagonala streck (Saint Patrick's Cross) - offset -->
  <path d="M0,0 L18,13.5 M2,0 L20,13.5" stroke="#C8102E" stroke-width="0.8" fill="none"/>
  <path d="M20,0 L2,13.5 M18,0 L0,13.5" stroke="#C8102E" stroke-width="0.8" fill="none"/>
  
  <!-- Vitt kors (Saint George's Cross) -->
  <rect x="0" y="6" width="20" height="3" fill="white"/>
  <rect x="8.5" y="0" width="3" height="15" fill="white"/>
  
  <!-- Rött kors (Saint George's Cross) -->
  <rect x="0" y="7" width="20" height="1" fill="#C8102E"/>
  <rect x="9.5" y="0" width="1" height="15" fill="#C8102E"/>
</svg>